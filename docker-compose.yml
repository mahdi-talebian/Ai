########################################################################
# docker-compose.yml — استقرار پروداکشن (اپ + nginx reverse proxy + SSL)
#
# استفاده:
#   1) فایل .env را از .env.example بسازید و DOMAIN و EMAIL را پر کنید.
#   2) ./deploy/init-ssl.sh را یک‌بار اجرا کنید (گواهی SSL اولیه را می‌گیرد).
#   3) docker compose up -d --build
#
# جزئیات کامل در DEPLOY.md
########################################################################

services:
  app:
    build: .
    container_name: quran-analyzer-app
    restart: unless-stopped
    # پورت مستقیم اپ به بیرون باز نمی‌شود — فقط از طریق nginx در دسترس است.
    expose:
      - "8080"
    volumes:
      # نتایج تحلیل (گزارش/تصویر/ویدیو هر job) روی دیسک واقعی سرور نگه
      # داشته می‌شود، نه فقط داخل container — با ری‌استارت/آپدیت container
      # از بین نمی‌رود.
      - jobs_data:/app/server/jobs
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: quran-analyzer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - app
    # nginx:alpine با envsubst روی templates/*.template قبل از استارت اجرا می‌شود
    command: /bin/sh -c "envsubst '$$DOMAIN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: quran-analyzer-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # هر ۱۲ ساعت چک می‌کند و در صورت نزدیک بودن انقضا، گواهی را تمدید می‌کند
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  jobs_data:
  certbot_www:
  certbot_conf:
